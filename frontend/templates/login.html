{% extends 'base.html' %}
{% block page_title %}Iniciar sesión{% endblock %}
{% block topbar_title %}Acceso{% endblock %}

{% block content %}
<div class="d-flex justify-content-center align-items-center min-vh-72">
  <div class="xo-card w-360">
    <div class="xo-card-body">
      <h2 class="fs-20 mb-22">Iniciar sesión</h2>

      <form method="post" novalidate>
        {% csrf_token %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}" />{% endif %}

        <div class="mb-3">
          <label>Usuario</label>
          <input type="text" name="username" class="form-control" placeholder="nombre" autofocus />
        </div>
        <div class="mb-4">
          <label>Contraseña</label>
          <input type="password" name="password" class="form-control" placeholder="••••••••" />
        </div>

        <button type="submit" class="xo-btn xo-btn-primary xo-btn-lg w-100">
          <i class="ti ti-arrow-right"></i> Entrar
        </button>
      </form>

      <div class="divider"></div>
      <p class="text-center fs-12" style="color:var(--text-3);">
        <a href="/registro/">Crear cuenta →</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
